name: Publish Python Package

# Publishes to PyPI on every push to main, using an API token stored in the
# PYPI_API_TOKEN repository secret. skip-existing avoids failing the run when
# the version in pyproject.toml/setup.py has not been bumped.
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
